title: Retro Multi Tools
description: >-
  A cross-platform desktop utility for managing, inspecting, and patching
  retro game ROMs.
baseurl: /RetroMultiTools
url: https://svengdk.github.io

remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme

color_scheme: retro-dark

# Back to top link on every page
back_to_top: true
back_to_top_text: "Back to top"

# Footer
gh_edit_link: false

# Heading anchor links
heading_anchors: true

# Navigation defaults — only the landing page appears in the sidebar;
# all other pages are reached through the links on that page.
defaults:
  - scope:
      path: ""
    values:
      layout: default
      nav_exclude: true
  - scope:
      path: "index.md"
    values:
      nav_exclude: false

exclude:
  - README.md
